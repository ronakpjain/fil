name: Release

# Rolling `continuous` release on every push to main (binaries for the
# latest commit), plus versioned releases on `v*` tags:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            asset: fil-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            asset: fil-linux-aarch64
          - runner: macos-15
            arch: arm64
            asset: fil-macos-arm64
    env:
      CC: ${{ startsWith(matrix.runner, 'macos') && 'clang' || 'gcc' }}
      CXX: ${{ startsWith(matrix.runner, 'macos') && 'clang++' || 'g++' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Set macOS deployment target
        if: startsWith(matrix.runner, 'macos')
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Diagnose AppleClang jthread (temporary)
        if: startsWith(matrix.runner, 'macos')
        run: |
          set -ux
          xcode-select -p || true
          xcodebuild -version || true
          /usr/bin/clang++ --version | head -2
          xcrun --show-sdk-path || true
          xcrun --show-sdk-version || true
          printf '#include <thread>\nint main(){ std::jthread t; return 0; }\n' > /tmp/jt.cpp
          /usr/bin/clang++ -std=c++20 /tmp/jt.cpp -o /tmp/jt-default 2>&1 | head -5 || true
          /usr/bin/clang++ -std=c++20 -mmacosx-version-min=14.0 /tmp/jt.cpp -o /tmp/jt-14 2>&1 | head -5 || true
          /usr/bin/clang++ -std=c++20 -mmacosx-version-min=15.0 /tmp/jt.cpp -o /tmp/jt-15 2>&1 | head -5 || true

      - name: Configure (Release, portable)
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFIL_BUILD_TESTS=OFF \
            -DFIL_BUILD_DOCS=OFF \
            -DFIL_ENABLE_IPO=ON \
            -DFIL_ENABLE_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu 2>/dev/null || nproc)"

      - name: Smoke test
        run: |
          ./build/fil --version
          ./build/fil --help

      - name: Package
        run: |
          set -eux
          mkdir dist
          cp build/fil "dist/${{ matrix.asset }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eux
          ls -la dist/
          (cd dist && shasum -a 256 fil-* | grep -v '\.sha256' > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Reset rolling release (main pushes only)
        if: github.ref_type != 'tag'
        run: |
          set -eux
          gh release delete continuous --cleanup-tag --yes || true
          git tag -f continuous "$GITHUB_SHA"
          git push origin continuous --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            dist/fil-linux-x86_64
            dist/fil-linux-aarch64
            dist/fil-macos-arm64
            dist/SHA256SUMS
