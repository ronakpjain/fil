name: Release

# Tagged releases with portable binaries for Linux (x86_64, aarch64) and
# macOS (arm64). Tag a commit `v*` to publish:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            asset: fil-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            asset: fil-linux-aarch64
          - runner: macos-15
            arch: arm64
            asset: fil-macos-arm64
    env:
      CC: ${{ startsWith(matrix.runner, 'macos') && 'clang' || 'gcc' }}
      CXX: ${{ startsWith(matrix.runner, 'macos') && 'clang++' || 'g++' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure (Release, portable)
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFIL_BUILD_TESTS=OFF \
            -DFIL_BUILD_DOCS=OFF \
            -DFIL_ENABLE_IPO=ON \
            -DFIL_ENABLE_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu 2>/dev/null || nproc)"

      - name: Smoke test
        run: |
          ./build/fil --version
          ./build/fil --help

      - name: Package
        run: |
          set -eux
          mkdir dist
          cp build/fil "dist/${{ matrix.asset }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eux
          ls -la dist/
          (cd dist && shasum -a 256 fil-* | grep -v '\.sha256' > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fil-linux-x86_64
            dist/fil-linux-aarch64
            dist/fil-macos-arm64
            dist/SHA256SUMS
          generate_release_notes: true
