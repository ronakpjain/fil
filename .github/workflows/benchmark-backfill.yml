name: Benchmark backfill

# Benchmark past commits: every fil commit in a range gets one JSONL row per
# architecture, each paired with its contemporary PER firmware artifact.
# Shards run in parallel; the merge job combines, dedupes, and publishes to
# the `benchmark-data` branch. Re-running is safe: commits already recorded
# in benchmark-data are skipped.
#
# Typical use: workflow_dispatch with defaults benchmarks all of main's
# history on both architectures (8 shards each).

on:
  workflow_dispatch:
    inputs:
      from:
        description: Oldest commit (exclusive unless include-from); empty = repository root
        default: ""
        required: false
      to:
        description: Newest commit (usually a main HEAD SHA)
        default: main
        required: false
      include-from:
        description: Include the `from` commit itself
        type: boolean
        default: true
      shards:
        description: Parallel shards per architecture
        default: "8"
        required: false
      arch:
        description: Architectures to benchmark
        type: choice
        default: all
        options: [all, x86_64, aarch64]
      duration-ms:
        description: Simulated duration per measurement in ms
        default: "5000"
        required: false
      reps:
        description: Repetitions per measurement
        default: "3"
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: plan shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan matrix
        id: plan
        run: |
          python3 - <<'EOF'
          import json, os
          shards = int("${{ inputs.shards }}" or "8")
          arch = "${{ inputs.arch }}" or "all"
          runners = {"x86_64": "ubuntu-24.04", "aarch64": "ubuntu-24.04-arm"}
          arches = ["x86_64", "aarch64"] if arch == "all" else [arch]
          include = [{"arch": a, "runner": runners[a], "shard": s, "shards": shards}
                     for a in arches for s in range(shards)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": include}) + "\n")
          print(f"{len(include)} shard jobs")
          EOF

  backfill:
    name: backfill ${{ matrix.arch }} shard ${{ matrix.shard }}
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CC: gcc
      CXX: g++
      CMAKE_GENERATOR: Ninja
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out (full history for worktrees)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache python3 unzip

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: backfill-${{ matrix.arch }}
          restore-keys: backfill-${{ matrix.arch }}

      - name: Fetch PER firmware catalog
        run: |
          set -eux
          tools/fetch_per_firmware.sh --mode catalog \
            --catalog "$RUNNER_TEMP/per-catalog.tsv"

      - name: Download existing history (resume)
        run: |
          set -eux
          rm -rf history && mkdir history
          if git clone --branch benchmark-data --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              history/bd 2>/dev/null; then
            cp history/bd/results/${{ matrix.arch }}.jsonl history/existing.jsonl 2>/dev/null || true
          fi
          wc -l history/existing.jsonl 2>/dev/null || echo "no existing history"

      - name: Run backfill shard
        run: |
          set -eux
          ARGS=(--to "${{ inputs.to }}" --catalog "$RUNNER_TEMP/per-catalog.tsv"
            --results "$RUNNER_TEMP/shard-${{ matrix.arch }}-${{ matrix.shard }}.jsonl"
            --shard-index "${{ matrix.shard }}" --shard-count "${{ matrix.shards }}"
            --duration-ms "${{ inputs.duration-ms }}" --reps "${{ inputs.reps }}"
            --work-root "$RUNNER_TEMP/backfill" --arch "${{ matrix.arch }}" --os "linux")
          if [ -f history/existing.jsonl ]; then
            ARGS+=(--skip-from history/existing.jsonl)
          fi
          if [ -n "${{ inputs.from }}" ]; then
            ARGS+=(--from "${{ inputs.from }}")
          fi
          if [ "${{ inputs.include-from }}" = "true" ]; then
            ARGS+=(--include-from)
          fi
          tools/bench_backfill.sh "${ARGS[@]}"
          echo "=== shard rows ==="
          wc -l "$RUNNER_TEMP/shard-${{ matrix.arch }}-${{ matrix.shard }}.jsonl"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ matrix.arch }}-shard${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shard-${{ matrix.arch }}-${{ matrix.shard }}.jsonl
            ${{ runner.temp }}/backfill/bench-*.log
          if-no-files-found: warn
          retention-days: 90

  merge:
    name: merge + publish
    needs: [backfill]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: backfill-*-shard*
          path: shards
          merge-multiple: true

      - name: Merge, dedupe, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ls shards/
          python3 - shards/merged.jsonl shards/*.jsonl <<'EOF'
          import glob, json, sys
          out, seen = [], set()
          # Later files win on (fil_sha, arch); sort oldest-first by fil date.
          rows = []
          for path in sys.argv[2:]:
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if line:
                          rows.append(json.loads(line))
          merged = {}
          for row in rows:
              merged[(row.get("fil_sha"), row.get("arch"))] = row
          ordered = sorted(merged.values(),
                           key=lambda r: (r.get("fil_date", ""), r.get("fil_sha", "")))
          with open(sys.argv[1], "w") as fh:
              for row in ordered:
                  fh.write(json.dumps(row, sort_keys=True) + "\n")
          print(f"merged {len(ordered)} rows from {len(rows)} shard rows")
          EOF
          rm -rf benchmark-data
          if git clone --branch benchmark-data --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              benchmark-data 2>/dev/null; then
            :
          else
            mkdir benchmark-data
            cd benchmark-data
            git init -b benchmark-data
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi
          cd benchmark-data
          git checkout -B benchmark-data
          mkdir -p results
          python3 - ../shards/merged.jsonl <<'EOF'
          import json, sys
          per_arch = {}
          with open(sys.argv[1]) as fh:
              for line in fh:
                  row = json.loads(line)
                  per_arch.setdefault(row.get("arch", "unknown"), []).append(line)
          for arch, lines in per_arch.items():
              # Merge with existing history, deduping by (fil_sha, arch).
              existing = {}
              try:
                  with open(f"results/{arch}.jsonl") as fh:
                      for line in fh:
                          if line.strip():
                              row = json.loads(line)
                              existing[(row.get("fil_sha"), row.get("arch"))] = line
              except FileNotFoundError:
                  pass
              for line in lines:
                  row = json.loads(line)
                  existing[(row.get("fil_sha"), row.get("arch"))] = line
              ordered = sorted((json.loads(line) for line in existing.values()),
                               key=lambda r: (r.get("fil_date", ""), r.get("fil_sha", "")))
              with open(f"results/{arch}.jsonl", "w") as fh:
                  for row in ordered:
                      fh.write(json.dumps(row, sort_keys=True) + "\n")
          print("histories updated")
          EOF
          git config user.name "fil-benchmark"
          git config user.email "fil-benchmark@users.noreply.github.com"
          git add results/
          git commit -m "backfill ${{ inputs.to }}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin benchmark-data; then
              exit 0
            fi
            git pull --rebase origin benchmark-data || git fetch origin benchmark-data
          done
          echo "failed to push benchmark-data after retries" >&2
          exit 1
